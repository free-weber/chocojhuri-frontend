
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 500"
     width="1000"
     height="1000">
  <defs>
    <linearGradient id="limeGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F3B0"/>
      <stop offset="100%" stop-color="#AEE26A"/>
    </linearGradient>
  </defs>

  <!-- Chocolate Basket -->
  <path d="M120 250 Q110 420 250 420 Q390 420 380 250 Z"
        fill="#6F3828"
        stroke="#FFFBEA"
        stroke-width="12"/>

  <!-- Basket Weave -->
  <path d="M135 300 Q250 320 365 300"
        fill="none"
        stroke="#402014"
        stroke-width="10"
        stroke-linecap="round"/>

  <path d="M150 350 Q250 370 350 350"
        fill="none"
        stroke="#402014"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Dark Chocolate Bar -->
  <g transform="translate(140 90) rotate(-20)">
    <rect width="90" height="140" rx="12"
          fill="#402014"
          stroke="#FFFBEA"
          stroke-width="6"/>
    <rect x="15" y="15" width="25" height="45"
          rx="6" fill="#6F3828"/>
    <rect x="50" y="15" width="25" height="45"
          rx="6" fill="#6F3828"/>
    <rect x="15" y="75" width="25" height="45"
          rx="6" fill="#6F3828"/>
    <rect x="50" y="75" width="25" height="45"
          rx="6" fill="#6F3828"/>
  </g>

  <!-- Lime Wrapped Chocolate -->
  <g transform="translate(290 110) rotate(15)">
    <rect width="80" height="130" rx="8"
          fill="url(#limeGradient)"
          stroke="#402014"
          stroke-width="6"/>
    <rect y="50" width="80" height="80" rx="8"
          fill="#402014"/>
  </g>

  <!-- Center Truffle -->
  <g transform="translate(250 160)">
    <path d="M-50 -40 L-15 0 L-50 40 Z"
          fill="url(#limeGradient)"/>
    <path d="M50 -40 L15 0 L50 40 Z"
          fill="url(#limeGradient)"/>
    <circle r="45" fill="#FFFBEA"/>
    <circle r="32" fill="#402014"/>
  </g>

  <!-- Front Lime Ribbon -->
  <path d="M120 250 Q250 280 380 250"
        fill="none"
        stroke="url(#limeGradient)"
        stroke-width="20"/>
</svg>
